[package]
name = "repo-xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "benchmark-host-helper"
path = "src/bin/benchmark_host_helper.rs"

[[bin]]
name = "benchmark-host-smoke"
path = "src/bin/benchmark_host_smoke.rs"

[[bin]]
name = "check-pins"
path = "src/bin/check_pins.rs"

[[bin]]
name = "render-benchmark-inventory"
path = "src/bin/render_benchmark_inventory.rs"

[dev-dependencies]
assert_cmd = "2"
serde_yaml = "0.9"
tempfile = "3"
