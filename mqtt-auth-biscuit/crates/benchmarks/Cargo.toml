[package]
name = "gen-tokens"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"

[dependencies]
base64 = "=0.22.1"
biscuit-auth = "=6.0.0"
bytes = "=1.11.1"
clap = { version = "=4.6.1", features = ["derive", "env"] }
hex = "=0.4.3"
http-body-util = "=0.1.3"
hyper = { version = "=1.10.1", features = ["server", "http2"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
p256 = { version = "=0.13.2", features = ["arithmetic", "pkcs8", "pem"] }
pkcs8 = { version = "=0.11.0", features = ["pem"] }
rand = "=0.10.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "json", "rustls"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
rumqttc = { package = "rumqttc-v5-next", path = "../../../rumqtt/rumqttc-v5", version = "=0.33.0", features = ["use-rustls-no-provider"] }
rustls = "=0.23.40"
rustls-pki-types = { version = "=1.14.1", features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-rustls = "=0.26.4"
webpki-roots = "=1.0.7"
