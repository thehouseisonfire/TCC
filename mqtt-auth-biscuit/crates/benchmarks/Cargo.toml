[package]
name = "gen-tokens"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"

[dependencies]
base64 = "=0.22.1"
biscuit-auth = "=6.0.0"
hex = "=0.4.3"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
p256 = { version = "=0.13.2", features = ["arithmetic", "pkcs8", "pem"] }
pkcs8 = { version = "=0.10.2", features = ["pem"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
