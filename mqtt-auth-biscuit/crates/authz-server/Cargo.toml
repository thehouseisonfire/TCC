[package]
name = "authz-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["std"] }
arc-swap = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[features]
default = ["tls"]
tls = []
