[package]
name = "authz-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"

[dependencies]
tokio = { version = "=1.50.0", features = ["full"] }
hyper = { version = "=1.8.1", features = ["server", "http2"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
bytes = "=1.11.1"
http-body-util = "=0.1.3"
tokio-rustls = "=0.26.4"
rustls = { version = "=0.23.37", features = ["std"] }
arc-swap = "=1.8.2"
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
rand = "=0.10.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
anyhow = "=1.0.102"

[features]
default = ["tls"]
tls = []
