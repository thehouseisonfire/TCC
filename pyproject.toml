[project]
name = "token-benchmark"
version = "0.1.0"
requires-python = "==3.14.2"
dependencies = [
  "dpkt==1.9.8",
  "httpx[http2]==0.28.1",
  "numpy==2.4.6",
  "pandas==3.0.3",
  "pydantic==2.13.4",
  "rich==15.0.0",
  "typer==0.26.7",
]

[dependency-groups]
dev = [
  "ansible-core==2.21.1",
  "black==26.5.1",
  "mypy==2.1.0",
  "pandas-stubs==3.0.3.260530",
  "pyrefly==1.1.1",
  "pytest==9.1.1",
  "ruff==0.15.18",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.black]
line-length = 100
target-version = ["py314"]
exclude = '''
/(
    \.venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py314"
fix = true
exclude = [
  ".venv",
]

[tool.ruff.lint]
select = [
  "E", "F",      # correctness
  "I",           # imports (replaces isort)
  "B",           # bugbear
  "UP",          # pyupgrade
  "SIM",         # simplify
]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
no_implicit_optional = true
exclude = '(\.venv)/'
ignore_missing_imports = true
num_workers = 4

[tool.pyrefly]
python-version = "3.14"
python-platform = "linux"
project-includes = ["mqtt-auth-biscuit"]
project-excludes = ["**/node_modules", "**/__pycache__", "**/*venv/**", "**/.[!/.]*/**"]
search-path = ["mqtt-auth-biscuit"]
use-ignore-files = true
