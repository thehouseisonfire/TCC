[package]
name = "mosquitto-auth-biscuit"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
expiry_stats = []

[dependencies]
biscuit-auth = "6"              # Biscuit v3 support (v6 API)
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
rusqlite = { version = "0.39", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"                      # C FFI types
base64 = "0.22"
chrono = "0.4"
lru = "0.16"
dashmap = "6"
hex = "0.4"
thiserror = "2"
rustls = "0.23"
webpki-roots = "1.0"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"], default-features = false }
tokio-rustls = "0.26"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
