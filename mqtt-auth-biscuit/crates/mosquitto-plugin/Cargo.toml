[package]
name = "mosquitto-auth-biscuit"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
expiry_stats = []

[dependencies]
biscuit-auth = "6.0"              # Biscuit v3 support (v6 API)
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
rusqlite = { version = "0.38", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"                      # C FFI types
once_cell = "1.21"                # Global state management
base64 = "0.22"
chrono = "0.4"
lru = "0.16"
dashmap = "6.1"
hex = "0.4"
thiserror = "2.0"
rustls = "0.23.36"
webpki-roots = "1.0.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
