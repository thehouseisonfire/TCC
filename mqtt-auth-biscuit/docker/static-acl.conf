# Role-based synthetic usernames (from token roles)
user role:admin
topic readwrite #

user role:reader
topic read sensors/#

user role:writer
topic write sensors/#

# Per-client fallback (client_id-based)
pattern readwrite sensors/%c/#

# Fanout
user role:admin
topic readwrite fanout/broadcast

user role:reader
topic read fanout/broadcast

user role:writer
topic write fanout/broadcast
