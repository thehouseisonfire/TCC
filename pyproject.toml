[project]
name = "token-benchmark"
version = "0.1.0"
requires-python = "==3.14.2"
dependencies = [
  "dpkt==1.9.8",
  "httpx[http2]==0.28.1",
  "numpy==2.4.2",
  "paho-mqtt==2.1.0",
  "pandas==3.0.1",
  "pydantic==2.12.5",
  "rich==14.3.3",
  "typer==0.24.1",
]

[dependency-groups]
dev = [
  "black==26.1.0",
  "mypy==1.19.1",
  "pandas-stubs==3.0.0.260204",
  "pytest==9.0.2",
  "ruff==0.15.4",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.black]
line-length = 100
target-version = ["py314"]
exclude = '''
/(
    \.venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py314"
fix = true
exclude = [
  ".venv",
]

[tool.ruff.lint]
select = [
  "E", "F",      # correctness
  "I",           # imports (replaces isort)
  "B",           # bugbear
  "UP",          # pyupgrade
  "SIM",         # simplify
]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
no_implicit_optional = true
exclude = '(\.venv)/'
ignore_missing_imports = true
