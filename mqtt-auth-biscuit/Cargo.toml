[package]
name = "mosquitto-auth-biscuit"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gen-tokens"
path = "benchmarks/gen_tokens.rs"

[[bin]]
name = "token-issuer"
path = "src/bin/token_issuer.rs"

[dependencies]
biscuit-auth = "6.0"              # Biscuit v3 support (v6 API)
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }            # JWT verification
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
rusqlite = { version = "0.38", features = ["bundled"] }  # SQLite for ACL storage
log = "0.4"
env_logger = "0.11"
libc = "0.2"                      # C FFI types
once_cell = "1.21"                # Global state management
base64 = "0.22"
chrono = "0.4"
lru = "0.16"
dashmap = "6.1"
hex = "0.4"
p256 = { version = "0.13", features = ["arithmetic", "pkcs8", "pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
thiserror = "2.0"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
rustls = "0.23.36"
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.5"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "z"
overflow-checks = false

[profile.release-maxperf]
inherits = "release"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true
overflow-checks = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
