[package]
name = "token-issuer"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"

[dependencies]
base64 = "=0.22.1"
biscuit-auth = "=6.0.0"
bytes = "=1.11.1"
chrono = "=0.4.44"
hex = "=0.4.3"
http-body-util = "=0.1.3"
hyper = { version = "=1.9.0", features = ["full"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
p256 = { version = "=0.13.2", features = ["arithmetic", "pkcs8", "pem"] }
pkcs8 = { version = "=0.11.0", features = ["pem"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net"] }
tokio-rustls = "=0.26.4"
rustls = "=0.23.40"
