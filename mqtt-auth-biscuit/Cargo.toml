[package]
name = "mosquitto-auth-biscuit"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "gen-tokens"
path = "benchmarks/gen_tokens.rs"

[dependencies]
biscuit-auth = "4.0"              # Biscuit v2 support
jsonwebtoken = "9.3"             # JWT verification
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.34", features = ["bundled"] }  # SQLite for ACL storage
log = "0.4"
env_logger = "0.11"
libc = "0.2"                      # C FFI types
once_cell = "1.19"                # Global state management
base64 = "0.22"
chrono = "0.4"
lru = "0.12"
dashmap = "5.5"
