name: Miri

on:
  push:
    paths:
      - "mqtt-auth-biscuit/**"
      - ".github/workflows/miri.yml"
  pull_request:
    paths:
      - "mqtt-auth-biscuit/**"
      - ".github/workflows/miri.yml"

jobs:
  miri:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Miri setup
        run: cargo --config build.rustflags=[] miri setup -p mosquitto-auth-biscuit
        working-directory: mqtt-auth-biscuit

      - name: Run Miri tests
        run: cargo --config build.rustflags=[] miri test -p mosquitto-auth-biscuit
        working-directory: mqtt-auth-biscuit

  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Kani
        run: cargo install kani-verifier --locked

      - name: Run Kani proofs
        run: cargo kani -p mosquitto-auth-biscuit -Z unstable-options --harness-timeout 1800
        working-directory: mqtt-auth-biscuit
