[package]
name = "mosquitto-auth-biscuit"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "gen-tokens"
path = "benchmarks/gen_tokens.rs"

[dependencies]
biscuit-auth = "6.0"              # Biscuit v2 support (v6 API)
jsonwebtoken = "9.3"             # JWT verification
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.38", features = ["bundled"] }  # SQLite for ACL storage
log = "0.4"
env_logger = "0.11"
libc = "0.2"                      # C FFI types
once_cell = "1.21"                # Global state management
base64 = "0.22"
chrono = "0.4"
lru = "0.16"
dashmap = "6.1"
hex = "0.4"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
