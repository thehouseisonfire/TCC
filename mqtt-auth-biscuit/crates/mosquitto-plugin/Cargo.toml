[package]
name = "mosquitto-auth-biscuit"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
expiry_stats = []

[dependencies]
biscuit-auth = "=6.0.0"              # Biscuit v3 support (v6 API)
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
rand = "=0.10.0"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
log = "=0.4.29"
env_logger = "=0.11.9"
libc = "=0.2.183"                   # C FFI types
base64 = "=0.22.1"
chrono = "=0.4.44"
lru = "=0.16.3"
dashmap = "=6.1.0"
hex = "=0.4.3"
thiserror = "=2.0.18"
rustls = "=0.23.37"
webpki-roots = "=1.0.6"
hyper = { version = "=1.8.1", features = ["client", "http2"] }
hyper-util = { version = "=0.1.20", features = ["client", "tokio"] }
http-body-util = "=0.1.3"
bytes = "=1.11.1"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "net", "time"], default-features = false }
tokio-rustls = "=0.26.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
