[package]
name = "gen-tokens"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"

[dependencies]
base64 = "=0.22.1"
biscuit-auth = "=6.0.0"
bytes = "=1.11.1"
clap = { version = "=4.5.53", features = ["derive", "env"] }
hex = "=0.4.3"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
p256 = { version = "=0.13.2", features = ["arithmetic", "pkcs8", "pem"] }
pkcs8 = { version = "=0.10.2", features = ["pem"] }
rand = "=0.10.1"
reqwest = { version = "=0.12.24", default-features = false, features = ["http2", "json", "rustls-tls"] }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
rumqttc = { package = "rumqttc-v5-next", path = "../../../rumqtt/rumqttc-v5", features = ["use-rustls-no-provider"] }
rustls = "=0.23.37"
rustls-pki-types = { version = "=1.14.0", features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-rustls = "=0.26.4"
webpki-roots = "=1.0.6"
