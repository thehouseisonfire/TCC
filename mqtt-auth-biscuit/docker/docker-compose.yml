version: '3.9'
services:
  mosquitto:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    cpuset: "0-1"
    mem_limit: 512m
    networks:
      - mqtt-net

  metrics-collector:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - mqtt-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - mqtt-net

networks:
  mqtt-net:
    driver: bridge
